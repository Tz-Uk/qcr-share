<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quran Cross-References</title>
  <meta name="description" content="All 6,236 verses of the Quran on one line, with 65,257 al-Mizan cross-references drawn as arcs, and a Sunni map from Ibn Ashur. Zoom, search, and read any verse with its connections in view.">
  <meta name="theme-color" content="#0a0f16">
  <meta property="og:title" content="Quran Cross-References">
  <meta property="og:description" content="All 6,236 verses of the Quran on one line, with 65,257 al-Mizan cross-references as arcs, and a Sunni map from Ibn Ashur.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./public/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./gate.css">
</head>
<body>
<div id="gate" role="dialog" aria-modal="true" aria-label="Password required">
  <form id="gate-form" autocomplete="off">
    <h1>Protected</h1>
    <p>Enter the password to open this page.</p>
    <input id="gate-pass" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Open</button>
    <p id="gate-error" role="alert"></p>
  </form>
</div>
  <a class="skip" href="#stage">Skip to the arcs</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Quran Cross-References, home">
      <svg class="brand-mark" viewBox="0 0 40 24" aria-hidden="true">
        <path d="M2 21c6 0 8-16 18-16s12 16 18 16" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M2 21c10 0 10-11 18-11s8 11 18 11" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <circle cx="2" cy="21" r="1.6" fill="currentColor"/><circle cx="38" cy="21" r="1.6" fill="currentColor"/>
      </svg>
      <span class="brand-text">Quran <em>Cross-References</em></span>
    </a>

    <div class="mode-switch" role="group" aria-label="Interpretive tradition">
      <button type="button" data-mode="shia" class="active" title="Shia — al-Mizan (default)">Shia</button>
      <button type="button" data-mode="sunni" title="Sunni — Ibn Ashur">Sunni</button>
    </div>

    <div class="searchbox" role="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.6 13.6 18 18" stroke="currentColor" stroke-width="1.6"/></svg>
      <input id="search" type="search" placeholder="Search 2:255, Al-Baqarah, or words…" autocomplete="off" spellcheck="false" aria-label="Search verses, surahs or words" aria-expanded="false" aria-controls="results">
      <div id="results" class="results" role="listbox" hidden></div>
    </div>

    <div class="topbar-tools">
      <label class="select-wrap" title="Translation">
        <span class="sr-only">Translation</span>
        <select id="translation">
          <option value="pickthall">Pickthall</option>
          <option value="yusufali">Yusuf Ali</option>
        </select>
      </label>
      <button id="about-btn" class="icon-btn" title="About this project" aria-label="About this project">?</button>
      <button id="theme-btn" class="icon-btn" title="Toggle light and dark" aria-label="Toggle light and dark">
        <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M16 4l-1.4 1.4M5.4 14.6 4 16" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <canvas id="overlay" aria-hidden="true"></canvas>
    <canvas id="arcs" aria-label="Quran cross-reference map. Click the field for a surah, click the axis for a verse. Plus and minus zoom." role="application"></canvas>
    <div id="minimap" class="minimap" hidden aria-label="Overview of the whole Quran">
      <div id="miniwin" class="miniwin"></div>
    </div>
    <div id="tooltip" class="tooltip" hidden></div>
    <div id="legend" class="legend" aria-hidden="true">
      <span><b>Field</b> surah</span>
      <span><b>Axis</b> verse</span>
      <span><b>Scroll</b> zoom</span>
    </div>
    <div id="hint" class="hint">Click the field for a surah · click the axis for a verse · scroll to zoom</div>
    <div id="loading" class="loading"><span></span>Loading 6,236 verses and their connections…</div>
  </main>

  <div id="surah-label" class="surah-label" aria-hidden="true"></div>
  <nav id="surahbar" class="surahbar" aria-label="Surahs"></nav>

  <footer class="footbar">
    <div class="foot-left">
      <span id="stats">—</span>
      <button id="source-btn" class="text-btn">al-Mizan, <i>al-Mizan fi Tafsir al-Qur'an</i></button>
    </div>
    <div class="legend" aria-label="Arc colours">
      <span class="legend-item"><i class="dot mm"></i>Meccan</span>
      <span class="legend-item"><i class="dot dd"></i>Medinan</span>
      <span class="legend-item"><i class="dot grad"></i>Meccan–Medinan</span>
    </div>
    <div class="foot-right">
      <label class="select-wrap small" title="Reading order">
        <span class="sr-only">Reading order</span>
        <select id="order">
          <option value="mushaf">Mushaf order</option>
          <option value="revelation">Revelation order</option>
        </select>
      </label>
      <label class="select-wrap small" title="Filter by connection type">
        <span class="sr-only">Connection type</span>
        <select id="category"><option value="-1">All connections</option></select>
      </label>
      <label class="select-wrap small keep" title="When to draw the connections">
        <span class="sr-only">Connection visibility</span>
        <select id="links-mode">
          <option value="all">All connections</option>
          <option value="focus">On highlight</option>
        </select>
      </label>
      <div class="zoombtns">
        <button id="random" class="icon-btn" title="Open a random verse (R)" aria-label="Open a random verse">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h2.5L15 14h2M3 14h2.5L15 6h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m14.5 3.5 2.5 2.5-2.5 2.5M14.5 11.5l2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="zoom-out" class="icon-btn" aria-label="Zoom out">−</button>
        <button id="zoom-in" class="icon-btn" aria-label="Zoom in">+</button>
        <button id="reset" class="icon-btn wide" aria-label="Show the whole Quran">Reset</button>
      </div>
    </div>
  </footer>

  <aside id="panel" class="panel" hidden aria-label="Verse details">
    <div class="panel-head">
      <div>
        <div class="ref" id="p-ref">—</div>
        <div class="sub" id="p-sub">—</div>
      </div>
      <button id="panel-close" class="icon-btn" aria-label="Close details">✕</button>
    </div>
    <div class="panel-chips" id="p-chips"></div>
    <div class="panel-body" id="p-body"></div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="icon-btn modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./gate.js" defer></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
